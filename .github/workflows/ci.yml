# .github/workflows/ci.yml
name: CI
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # separate cache from the Python 3.12 test job, which otherwise races it for the same key
          cache-suffix: lint
          python-version: "3.12"
      - name: Sync deps (frozen)
        run: uv sync --frozen --all-extras --all-groups
      - name: Build
        run: uv run hatch build
      - name: Lint & format check
        run: uv run hatch fmt --check
      - name: Type check
        run: uv run hatch run typing:check
  test-matrix:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync deps (frozen)
        run: uv sync --frozen --all-extras --all-groups
      - name: Run tests (fails below 90% total coverage)
        run: uv run hatch test --parallel -py ${{ matrix.python-version }}
      - name: Check per-file coverage (85% minimum)
        run: |
          uv run coverage json -q -o coverage.json
          uv run python scripts/check_coverage.py coverage.json --min-file 85
  test:
    name: Tests
    if: always()
    runs-on: ubuntu-24.04
    needs: [test-matrix]
    steps:
      - name: Check Test Matrix
        if: ${{ needs.test-matrix.result != 'success' }}
        run: exit 1
