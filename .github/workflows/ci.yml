# .github/workflows/ci.yml
name: CI
permissions:
  contents: read
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          # separate cache from the Python 3.12 test job, which otherwise races it for the same key
          cache-suffix: lint
          python-version: "3.12"
      - name: Sync deps (frozen)
        run: uv sync --frozen --all-extras --all-groups
      - name: Build
        run: uv run hatch build
      - name: Lint & format check
        run: uv run hatch fmt --check
      - name: Type check
        run: uv run hatch run typing:check
  test-matrix:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync deps (frozen)
        run: uv sync --frozen --all-extras --all-groups
      - name: Run tests (fails below 90% total coverage)
        run: uv run hatch test --parallel -py ${{ matrix.python-version }} -- --junitxml=junit.xml
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: |
          echo "### Coverage (Python ${{ matrix.python-version }}, ${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - name: Check per-file coverage (85% minimum)
        run: |
          uv run coverage json -q -o coverage.json
          uv run python scripts/check_coverage.py coverage.json --min-file 85
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-${{ matrix.os }}-py${{ matrix.python-version }}
          path: junit.xml
          if-no-files-found: ignore
  test:
    name: Tests
    if: always()
    runs-on: ubuntu-24.04
    needs: [test-matrix]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Download test results
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: test-results
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        with:
          check_name: Test Results
          files: test-results/**/*.xml
      - name: Check Test Matrix
        if: ${{ needs.test-matrix.result != 'success' }}
        run: exit 1
